name: AngelNumbers
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
targets:
  AngelNumbers:
    type: application
    platform: iOS
    sources: [AngelNumbers]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AngelNumbers
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Angel Numbers
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
